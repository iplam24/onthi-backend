name: Deploy VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/onthi-backend

            git fetch origin
            git reset --hard origin/main

            mvn clean package -DskipTests

            pkill -f 'java.*jar' || true

            nohup java \
              -Xms256m \
              -Xmx1024m \
              -jar target/*.jar \
              > app.log 2>&1 &