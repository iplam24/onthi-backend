# Datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/vedu_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
app.jwt-secret=YourSuperSecretKeyThatIsAtLeast256BitsLongAndShouldBeStoredSecurelyInProduction
app.jwt-expiration-milliseconds=86400000

# Server Port
server.port=8080

# Application metadata
spring.application.name=V-Edu
app.version=1.0.0
app.description=V-Edu Spring Boot Backend
app.environment=development

